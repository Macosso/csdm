name: R-CMD-check
on:
  push:
    branches: [main, master, code_refactor, 'release-*']
  pull_request:
  workflow_dispatch:

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      R_PROFILE_USER: /dev/null
      # pak workers read the project profile; CI uses the action's library.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      # Allow slower Windows workers up to 60 seconds to start (milliseconds).
      PKG_SUBPROCESS_TIMEOUT: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
